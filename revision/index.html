<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrolia Live — revisión por persona</title>
<style>
  :root {
    --fondo: #f6f4fa; --panel: #fff; --borde: #dcd6e8; --texto: #221a35; --suave: #6a6080;
    --acento: #6b3fc4; --oro: #a8730a; --ok: #1d7a4c; --alerta: #b3261e; --alerta-fondo: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #151022; --panel: #1f1833; --borde: #372c55; --texto: #efe9fb; --suave: #a79cc2;
            --acento: #b79cff; --oro: #ecc878; --ok: #6fd3a0; --alerta: #ff8a80; --alerta-fondo: #3a1a1c; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; padding: 20px 16px 60px; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .sub { color: var(--suave); margin: 2px 0 16px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  select, input[type=search] { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--borde);
                               border-radius: 8px; padding: 8px 10px; }
  input[type=search] { flex: 1; min-width: 200px; }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--suave); white-space: nowrap; }
  button { font: inherit; color: var(--acento); background: none; border: 1px solid var(--borde); border-radius: 8px;
           padding: 8px 12px; cursor: pointer; }
  .totales { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .total { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; }
  .total b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .total span { color: var(--suave); font-size: 13px; }
  .total.alerta b { color: var(--alerta); }
  details { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; margin-bottom: 8px; }
  details.alerta { border-color: var(--alerta); }
  summary { cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  .nombre { font-weight: 700; overflow-wrap: anywhere; }
  .nombre small { font-weight: 400; color: var(--suave); margin-left: 6px; }
  .cifras { color: var(--suave); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cifras .monedas { color: var(--oro); font-weight: 700; }
  .estado { grid-column: 1 / -1; font-size: 14px; color: var(--suave); }
  .estado.leida { color: var(--ok); }
  .aviso { grid-column: 1 / -1; font-size: 14px; font-weight: 700; color: var(--alerta); background: var(--alerta-fondo);
           border-radius: 6px; padding: 4px 8px; justify-self: start; }
  ol { list-style: none; padding: 4px 14px 12px; border-top: 1px solid var(--borde); }
  li { display: grid; grid-template-columns: 62px 22px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--borde); }
  li:last-child { border-bottom: 0; }
  .hora { color: var(--suave); font-size: 13px; font-variant-numeric: tabular-nums; }
  .texto { overflow-wrap: anywhere; }
  .nota { display: block; color: var(--suave); font-size: 13px; font-weight: 400; }
  .sistema .texto { color: var(--acento); }
  .regalo .texto { color: var(--oro); font-weight: 700; }
  .malo .texto { color: var(--alerta); }
  .vacio { color: var(--suave); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>Revisión por persona</h1>
  <p class="sub">Qué escribió cada quien y qué hizo el sistema con ello. Es una página privada: muestra los mensajes tal como llegaron.</p>
  <div class="barra">
    <select id="sesion" aria-label="Live"></select>
    <input id="buscar" type="search" placeholder="Buscar por nombre o por texto…" aria-label="Buscar">
    <label class="chk"><input id="solo-alertas" type="checkbox"> Solo con alerta</label>
    <label class="chk"><input id="solo-regalo" type="checkbox"> Solo quienes regalaron</label>
    <button id="abrir" type="button">Abrir todas</button>
    <button id="recargar" type="button">Actualizar</button>
  </div>
  <div id="totales" class="totales"></div>
  <div id="personas"></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ICONOS = { comentario: "💬", regalo: "🎁", follow: "➕", lectura: "🔮", mensaje_fijo: "✋", pide_fecha: "📅",
                 pide_pregunta: "❓", pide_regalo: "🍩", gratis_agotada: "⌛", boost: "⚡", saltado: "⏭", sin_fecha: "⌛", pregunta_tardia: "↩" };
const SISTEMA = new Set(["lectura", "mensaje_fijo", "pide_fecha", "pide_pregunta", "pide_regalo", "gratis_agotada", "boost", "pregunta_tardia"]);
const MALO = new Set(["saltado", "sin_fecha"]);
let datos = { personas: [], totales: {} };
let abiertas = location.hash === "#todas";

function el(etiqueta, clase, texto) {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto != null) e.textContent = texto;          // los mensajes del chat nunca entran como HTML
  return e;
}
const hora = (ts) => new Date(ts).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

function nota(e) {
  const partes = [];
  if (e.tipo === "comentario") {
    if (e.veces > 1) partes.push(`escrito ${e.veces} veces`);
    if (e.es) partes.push(`se entendió como: ${e.es}`);
    if (e.signo) partes.push(`signo ${e.signo}`);
    if (e.tema) partes.push(`tema que no se lee: ${e.tema}`);
  }
  if (e.tipo === "regalo") partes.push(`${e.valor || 0} monedas`);
  if (e.tipo === "lectura") {
    partes.push(e.nivel || "lectura", e.pregunta ? `pregunta: “${e.pregunta}”` : "mensaje general, sin pregunta");
    if (e.cartas) partes.push(e.cartas.join(", "));
  }
  if (e.situacion) partes.push(`→ ${e.situacion}`);
  return partes.join(" · ");
}

function tarjeta(p) {
  const d = el("details", p.alerta ? "alerta" : "");
  d.open = abiertas;
  const s = el("summary");
  const nombre = el("span", "nombre", p.nickname || p.user);
  nombre.append(el("small", "", `@${p.user}${p.signo ? " · " + p.signo : ""}`));
  const cifras = el("span", "cifras");
  if (p.monedas) cifras.append(el("span", "monedas", `${p.monedas} monedas`), " · ");
  cifras.append(`${p.lecturas} lectura${p.lecturas === 1 ? "" : "s"} · ${p.comentarios} mensaje${p.comentarios === 1 ? "" : "s"}`);
  s.append(nombre, cifras, el("span", p.lecturas ? "estado leida" : "estado", p.estado));
  if (p.alerta) s.append(el("span", "aviso", p.alerta));
  const lista = el("ol");
  for (const e of p.eventos) {
    const li = el("li", SISTEMA.has(e.tipo) ? "sistema" : MALO.has(e.tipo) ? "malo" : e.tipo);
    const texto = el("span", "texto", e.texto || "");
    const n = nota(e);
    if (n) texto.append(el("span", "nota", n));
    li.append(el("span", "hora", hora(e.ts)), el("span", "", ICONOS[e.tipo] || "•"), texto);
    lista.append(li);
  }
  d.append(s, lista);
  return d;
}

function pintar() {
  const q = $("buscar").value.trim().toLowerCase();
  const visibles = datos.personas.filter((p) =>
    (!$("solo-alertas").checked || p.alerta) && (!$("solo-regalo").checked || p.monedas) &&
    (!q || `${p.nickname} ${p.user}`.toLowerCase().includes(q) || p.eventos.some((e) => (e.texto || "").toLowerCase().includes(q))));
  const t = datos.totales;
  const cajas = [["personas", "personas"], ["con_regalo", "regalaron"], ["monedas", "monedas"], ["lecturas", "lecturas"], ["alertas", "con alerta"]];
  $("totales").replaceChildren(...cajas.map(([k, nombre]) => {
    const c = el("div", k === "alertas" && t[k] ? "total alerta" : "total");
    c.append(el("b", "", t[k] ?? 0), el("span", "", nombre));
    return c;
  }));
  $("personas").replaceChildren(...(visibles.length ? visibles.map(tarjeta)
    : [el("p", "vacio", datos.sesion ? "Nadie coincide con ese filtro." : "Todavía no hay ningún live guardado. La bitácora empieza al arrancar el backend.")]));
}

async function cargar() {
  const r = await fetch(`datos?sesion=${encodeURIComponent($("sesion").value)}`, { cache: "no-store" });
  datos = await r.json();
  pintar();
}

async function iniciar() {
  const lista = await (await fetch("sesiones", { cache: "no-store" })).json();
  $("sesion").replaceChildren(...lista.map((n, i) => {
    const o = el("option", "", n.slice(0, 10) + " " + n.slice(11, 19).replaceAll("-", ":") + (i === 0 ? " (el más reciente)" : ""));
    o.value = n;
    return o;
  }));
  await cargar();
}

$("sesion").addEventListener("change", cargar);
$("recargar").addEventListener("click", cargar);
$("abrir").addEventListener("click", () => {
  abiertas = !abiertas;
  $("abrir").textContent = abiertas ? "Cerrar todas" : "Abrir todas";
  pintar();
});
for (const id of ["buscar", "solo-alertas", "solo-regalo"]) $(id).addEventListener("input", pintar);
iniciar();
</script>
</body>
</html>
